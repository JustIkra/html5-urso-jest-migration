<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Urso Examples</title>
  <style>
    html,
    body {
      margin: 0;
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
    }

    canvas {
      display: block;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #ext-viewport .x-body {
      background-color: transparent;
    }

    .x-layout-card-item {
      background-color: transparent;
    }

    .progress-bar {
      background-color: #FFFFFF;
      height: 20px;
      padding: 3px;
      max-width: 200px;
      width: 80%;
      margin: 25px 0;
      border-radius: 5px;
      box-shadow: 0 1px 5px #000 inset, 0 1px 0 #444;
    }

    .progress-bar span {
      display: inline-block;
      height: 100%;
      border-radius: 3px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, .5) inset;
      transition: width .4s ease-in-out;
    }

    .blue span {
      background-color: #d217b3;
    }

    .wrapper {
      background: black;
      width: 100%;
      height: 100%;
      position: fixed;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }

    .loading-text {
      display: inline
    }

    .fullscreen {
      margin: 0;
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      bottom: 0;
      background: #000;
      opacity: 0.6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .fullscreen-ios {
      text-align: center;
      justify-content: start;
      height: 10000px;
      z-index: 1;
    }

    .fullscreen-ios>div {
      margin-top: 50px;
      position: fixed;
    }

    .fullscreen-info>span {
      margin: 0 auto;
      font-size: 2em;
      color: white;
      display: block;
      margin-top: 60px;
    }

    .fullscreen-info>img {
      width: 70px;
      height: auto;
      margin: 0 auto;
      display: block;
    }
  </style>
</head>

<body>
  <script type="module" src="/src/index.js"></script>
</body>

</html>
